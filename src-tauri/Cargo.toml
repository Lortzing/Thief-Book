[package]
name = "thief-book"
version = "5.0.0"
description = "极简摸鱼阅读器:老板键、悬停显隐、hjkl 翻页、自动记忆阅读进度"
authors = ["tal"]
license = "MIT"
edition = "2021"

[lib]
name = "thief_book_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
device_query = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
