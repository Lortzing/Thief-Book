name: CI & Release

# master 推送:只跑单测;推 v* 标签(或手动触发):单测 → 三平台构建 → 草稿 Release → 汇总发布。
# Tauri 产物体积极小(系统 WebView),无签名(下载后需自行放行)。

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签(如 v5.0.0,需以 v 开头)'
        required: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - id: t
        run: echo "value=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: 创建草稿 Release
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Thief Book $TAG" \
              --generate-notes --target "$GITHUB_SHA"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.t.outputs.value }}

  build:
    needs: [test, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
            add_target: ''
          - os: macos-latest
            args: --target x86_64-apple-darwin
            add_target: x86_64-apple-darwin
          - os: windows-latest
            args: ''
            add_target: ''
          - os: ubuntu-latest
            args: ''
            add_target: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: 添加交叉编译目标
        if: matrix.add_target != ''
        run: rustup target add ${{ matrix.add_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: npm ci
      - name: 构建
        shell: bash
        run: npx tauri build ${{ matrix.args }}
      - name: 上传产物到 Release
        shell: bash
        run: |
          set -e
          found=0
          while IFS= read -r -d '' f; do
            echo "上传: $f"
            gh release upload "$TAG" "$f" --clobber
            found=1
          done < <(find src-tauri/target -type f -path '*/bundle/*' \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -print0)
          test "$found" = 1 || { echo "没有找到构建产物"; exit 1; }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}

  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - name: 发布 Release
        run: gh release edit "$TAG" --draft=false -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
