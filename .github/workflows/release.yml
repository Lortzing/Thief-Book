name: CI & Release

# master 推送:只跑单测;推 v* 标签(或手动触发):单测 → 三平台构建 → 草稿 Release → 汇总发布。
# 零运行时依赖、无原生模块,mac 上可交叉构建 x64,无签名(下载后需自行放行)。

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签(如 v4.0.1,需以 v 开头)'
        required: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.value }}
    steps:
      - uses: actions/checkout@v5
      - id: t
        run: echo "value=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: 创建草稿 Release
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Thief Book $TAG" \
              --generate-notes --target "$GITHUB_SHA"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.t.outputs.value }}

  build:
    needs: [test, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: --mac dmg zip
            arches: --arm64 --x64
          - os: windows-latest
            targets: --win nsis
            arches: --x64
          - os: ubuntu-latest
            targets: --linux AppImage deb
            arches: --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 构建
        run: npx electron-builder ${{ matrix.targets }} ${{ matrix.arches }} --publish never
      - name: 上传产物到 Release
        shell: bash
        run: |
          set -e
          found=0
          while IFS= read -r -d '' f; do
            echo "上传: $f"
            gh release upload "$TAG" "$f" --clobber
            found=1
          done < <(find out -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
            ! -path '*unpacked*' -print0)
          test "$found" = 1 || { echo "没有找到构建产物"; exit 1; }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}

  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - name: 发布 Release
        run: gh release edit "$TAG" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
